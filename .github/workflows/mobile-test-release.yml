name: Mobile test release

on:
  workflow_dispatch:
  push:
    tags: ["test-release-*"]

permissions:
  contents: read

concurrency:
  group: mobile-test-release
  cancel-in-progress: false

jobs:
  google-play-internal:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Configure Android signing and API keys
        env:
          UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          IQ_BIBLE_KEY: ${{ secrets.IQ_BIBLE_API_KEY }}
          API_BIBLE_KEY: ${{ secrets.API_BIBLE_KEY }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          required = ['UPLOAD_KEYSTORE', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD', 'GEMINI_KEY', 'IQ_BIBLE_KEY']
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing required release secrets: ' + ', '.join(missing))
          root = pathlib.Path.cwd()
          keystore = pathlib.Path(os.environ['RUNNER_TEMP']) / 'upload.keystore'
          keystore.write_bytes(base64.b64decode(os.environ['UPLOAD_KEYSTORE']))
          keystore.chmod(0o600)
          def escaped(value):
              value = value.replace('\\', '\\\\')
              for character in '=:# !':
                  value = value.replace(character, '\\' + character)
              return value
          values = {
              'ANDROID_RELEASE_STORE_FILE': str(keystore),
              'ANDROID_RELEASE_STORE_PASSWORD': os.environ['STORE_PASSWORD'],
              'ANDROID_RELEASE_KEY_ALIAS': os.environ['KEY_ALIAS'],
              'ANDROID_RELEASE_KEY_PASSWORD': os.environ['KEY_PASSWORD'],
              'GEMINI_API_KEY': os.environ['GEMINI_KEY'],
              'IQ_BIBLE_API_KEY': os.environ['IQ_BIBLE_KEY'],
              'api_key_api_bible': os.environ.get('API_BIBLE_KEY', ''),
          }
          (root / 'local.properties').write_text(''.join(f'{key}={escaped(value)}\n' for key, value in values.items()))
          PY
      - name: Build signed release bundle
        run: ./gradlew :androidApp:bundleRelease --stacktrace
      - id: google-auth
        name: Authenticate to Google Play
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - name: Upload to internal testing
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: |
          python3 tools/google_play_upload.py \
            --package email.kevinphillips.biblebible \
            --bundle androidApp/build/outputs/bundle/release/androidApp-release.aab \
            --track internal \
            --release-name "BibleBible 7.1 (18)"

  testflight:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Configure Apple signing and API keys
        env:
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          IQ_BIBLE_KEY: ${{ secrets.IQ_BIBLE_API_KEY }}
          API_BIBLE_KEY: ${{ secrets.API_BIBLE_KEY }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          required = ['P12_BASE64', 'P12_PASSWORD', 'ASC_PRIVATE_KEY', 'GEMINI_KEY', 'IQ_BIBLE_KEY']
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing required release secrets: ' + ', '.join(missing))
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          (temp / 'distribution.p12').write_bytes(base64.b64decode(os.environ['P12_BASE64']))
          (temp / 'AuthKey.p8').write_text(os.environ['ASC_PRIVATE_KEY'])
          values = {
              'GEMINI_API_KEY': os.environ['GEMINI_KEY'],
              'IQ_BIBLE_API_KEY': os.environ['IQ_BIBLE_KEY'],
              'api_key_api_bible': os.environ.get('API_BIBLE_KEY', ''),
          }
          pathlib.Path('local.properties').write_text(''.join(f'{key}={value}\n' for key, value in values.items()))
          PY
          KEYCHAIN_PASSWORD="$(uuidgen)"
          KEYCHAIN_PATH="$RUNNER_TEMP/biblebible-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/distribution.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
      - name: Archive and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          ./gradlew :composeApp:linkReleaseFrameworkIosArm64
          xcodebuild archive \
            -project iosApp/BibleBible.xcodeproj \
            -target iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/BibleBible.xcarchive" \
            DEVELOPMENT_TEAM=7JJ7U4528N \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          python3 - <<'PY'
          import os, pathlib
          pathlib.Path(os.environ['RUNNER_TEMP'], 'ExportOptions.plist').write_text('''<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>7JJ7U4528N</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>''')
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/BibleBible.xcarchive" \
            -exportPath "$RUNNER_TEMP/TestFlight" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
