name: Regression tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  shared-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: xvfb-run -a ./gradlew :composeApp:desktopTest :composeApp:testDebugUnitTest --console=plain --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: composeApp/build/reports/tests/
