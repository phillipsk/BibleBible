material-icons = "1.7.3"
junit = "4.13.2"
kotlin = "2.4.21"
buildKonfig = "0.23.0"
kotlinxCoroutines = "1.11.0"
kotlinx-json = "1.12.0"
ktor = "3.6.0"
napier = "2.7.1"
sqlDelight = "2.4.1"
